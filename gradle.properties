# fork: the release Kotlin compile OOMs on the shared build VM. The out-of-process Kotlin daemon
# ignores org.gradle.jvmargs, so compile IN-PROCESS in the Gradle daemon and give it a big heap.
# Project-only (not in ~/.gradle); safe on CI (16 GB runners).
org.gradle.jvmargs=-Xmx7168m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# fork: speed for this project only (build cache, parallel, configuration cache); not in ~/.gradle,
# where they broke other projects on the same machine
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
