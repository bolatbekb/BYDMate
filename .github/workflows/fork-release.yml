# Fork-only: builds the signed release APK.
#  - every push to main: APK as a build artifact (Actions › run › Artifacts);
#  - a tag v* (e.g. v4.4.0.2): also a GitHub Release with the APK attached and the notes from
#    release-notes/<tag>.md (required, written by a human), which the
#    in-app updater (ForkConfig.UPDATE_REPO) picks up.
# Signing comes from repo secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
# SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Kept apart from ci.yml so upstream merges don't touch it.
name: Fork release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    if: github.repository == 'bolatbekb/BYDMate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Release notes written
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Every release needs human notes of what changed (FORK.md, "Релиз").
          test -s "release-notes/${GITHUB_REF_NAME}.md" || {
            echo "::error::release-notes/${GITHUB_REF_NAME}.md is missing or empty: describe what changed before tagging"
            exit 1
          }

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are not set; an unsigned APK cannot update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f "app/build/outputs/apk/release/BYDMate-${GITHUB_REF_NAME}.apk" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName in app/build.gradle.kts"
            ls app/build/outputs/apk/release/
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: BYDMate-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "BYDMate ${GITHUB_REF_NAME#v} (fork)" --notes-file "release-notes/${GITHUB_REF_NAME}.md"

      - name: Clean up the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
